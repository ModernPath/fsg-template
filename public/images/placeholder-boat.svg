<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="300" fill="url(#skyGrad)"/>
  
  <!-- Water -->
  <rect y="300" width="800" height="300" fill="url(#waterGrad)"/>
  
  <!-- Sun -->
  <circle cx="650" cy="100" r="60" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Boat hull -->
  <path d="M 250 350 Q 250 380 280 390 L 520 390 Q 550 380 550 350 L 530 350 L 270 350 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Boat deck -->
  <rect x="270" y="330" width="260" height="20" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Cabin -->
  <rect x="340" y="270" width="120" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <rect x="360" y="285" width="35" height="30" fill="#60a5fa" opacity="0.3"/>
  <rect x="405" y="285" width="35" height="30" fill="#60a5fa" opacity="0.3"/>
  
  <!-- Flag -->
  <line x1="480" y1="270" x2="480" y2="220" stroke="#6b7280" stroke-width="2"/>
  <polygon points="480,220 520,232 480,244" fill="#ef4444"/>
  
  <!-- Waves -->
  <path d="M 0 400 Q 50 390 100 400 T 200 400 T 300 400 T 400 400 T 500 400 T 600 400 T 700 400 T 800 400" 
        stroke="#e0f2fe" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 0 420 Q 50 410 100 420 T 200 420 T 300 420 T 400 420 T 500 420 T 600 420 T 700 420 T 800 420" 
        stroke="#e0f2fe" stroke-width="2" fill="none" opacity="0.4"/>
</svg>

